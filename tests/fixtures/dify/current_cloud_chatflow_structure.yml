# Sanitized current-Dify structural compatibility fixture.
# This is not proof of compatibility with every Dify release and is not live-import verified.
app:
  description: Starter Dify RAG app for local or private model endpoints.
  icon: 🩺
  icon_background: '#E1F5FE'
  icon_type: emoji
  mode: advanced-chat
  name: InferDoctor Local Private RAG
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start_node-source-knowledge_retrieval-target
      source: start_node
      sourceHandle: source
      target: knowledge_retrieval
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: knowledge_retrieval-source-llm_answer-target
      source: knowledge_retrieval
      sourceHandle: source
      target: llm_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: llm_answer-source-answer_node-target
      source: llm_answer
      sourceHandle: source
      target: answer_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 54
      id: start_node
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        dataset_ids: []
        desc: Select a Dify knowledge base after manual import.
        multiple_retrieval_config:
          reranking_enable: false
          reranking_model:
            model: ''
            provider: ''
          top_k: 4
        query_variable_selector:
        - sys
        - query
        retrieval_mode: single
        selected: false
        title: Retrieve knowledge
        type: knowledge-retrieval
      height: 120
      id: knowledge_retrieval
      position:
        x: 380
        y: 220
      positionAbsolute:
        x: 380
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        context:
          enabled: true
          variable_selector:
          - knowledge_retrieval
          - result
        desc: Configure the model provider and model name in Dify after import.
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.9
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: system-prompt
          role: system
          text: Use the retrieved context when it is relevant. If the answer is not in the context, say that you do not know.
        - id: user-prompt
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: Generate answer
        type: llm
        variables: []
        vision:
          enabled: false
      height: 156
      id: llm_answer
      position:
        x: 680
        y: 200
      positionAbsolute:
        x: 680
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        answer: '{{#llm_answer.text#}}'
        desc: ''
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 104
      id: answer_node
      position:
        x: 980
        y: 230
      positionAbsolute:
        x: 980
        y: 230
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.8
